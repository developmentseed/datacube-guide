<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="220" viewBox="0 0 650 220"
     font-family="Helvetica,Arial,sans-serif">
  <style>
    .panel  { fill:#FAFAFA; stroke:#CFD8DC; }
    .title  { fill:#263238; font-size:13px; font-weight:bold; text-anchor:middle; }
    .sub    { fill:#546E7A; font-size:10px; text-anchor:middle; }
    .grid   { fill:none; stroke:#455A64; stroke-width:1; }
    .a { fill:#C8E6C9; } .b { fill:#A5D6A7; } .c { fill:#81C784; }
    .d { fill:#FFE082; } .e { fill:#FFB74D; }
    .pt     { fill:#1976D2; stroke:#0D47A1; stroke-width:0.8; }
    .lbl    { fill:#37474F; font-size:8.5px; text-anchor:middle; }
    .bound  { fill:none; stroke:#CFD8DC; stroke-dasharray:2,3; }
  </style>

  <!-- ============ Panel 1: Gridded ============ -->
  <rect class="panel" x="8" y="4" width="310" height="212" rx="8"/>
  <text class="title" x="163" y="22">Gridded</text>
  <text class="sub"   x="163" y="38">location implied by index (i, j)</text>
  <g transform="translate(43,52)">
    <rect class="a" x="0"   y="0"  width="40" height="28"/>
    <rect class="a" x="40"  y="0"  width="40" height="28"/>
    <rect class="b" x="80"  y="0"  width="40" height="28"/>
    <rect class="c" x="120" y="0"  width="40" height="28"/>
    <rect class="d" x="160" y="0"  width="40" height="28"/>
    <rect class="e" x="200" y="0"  width="40" height="28"/>

    <rect class="a" x="0"   y="28" width="40" height="28"/>
    <rect class="b" x="40"  y="28" width="40" height="28"/>
    <rect class="c" x="80"  y="28" width="40" height="28"/>
    <rect class="d" x="120" y="28" width="40" height="28"/>
    <rect class="e" x="160" y="28" width="40" height="28"/>
    <rect class="e" x="200" y="28" width="40" height="28"/>

    <rect class="b" x="0"   y="56" width="40" height="28"/>
    <rect class="c" x="40"  y="56" width="40" height="28"/>
    <rect class="d" x="80"  y="56" width="40" height="28"/>
    <rect class="e" x="120" y="56" width="40" height="28"/>
    <rect class="e" x="160" y="56" width="40" height="28"/>
    <rect class="d" x="200" y="56" width="40" height="28"/>

    <rect class="c" x="0"   y="84" width="40" height="28"/>
    <rect class="d" x="40"  y="84" width="40" height="28"/>
    <rect class="d" x="80"  y="84" width="40" height="28"/>
    <rect class="e" x="120" y="84" width="40" height="28"/>
    <rect class="e" x="160" y="84" width="40" height="28"/>
    <rect class="d" x="200" y="84" width="40" height="28"/>

    <g class="grid">
      <path d="M0,0 L240,0 M0,28 L240,28 M0,56 L240,56 M0,84 L240,84 M0,112 L240,112"/>
      <path d="M0,0 L0,112 M40,0 L40,112 M80,0 L80,112 M120,0 L120,112 M160,0 L160,112 M200,0 L200,112 M240,0 L240,112"/>
    </g>
  </g>
  <text class="lbl" x="163" y="195">data[3, 4] = 0.84    (position only — grid geometry stored separately)</text>

  <!-- ============ Panel 2: Ungridded ============ -->
  <rect class="panel" x="332" y="4" width="310" height="212" rx="8"/>
  <text class="title" x="487" y="22">Ungridded</text>
  <text class="sub"   x="487" y="38">each value carries its own (lat, lon)</text>
  <g transform="translate(367,52)">
    <rect class="bound" x="0" y="0" width="240" height="112"/>
    <circle class="pt" cx="28"  cy="22"  r="4"/><text class="lbl" x="28"  y="14">(42.1,-73.5)</text>
    <circle class="pt" cx="95"  cy="44"  r="4"/><text class="lbl" x="95"  y="36">(41.8,-72.2)</text>
    <circle class="pt" cx="170" cy="18"  r="4"/><text class="lbl" x="170" y="10">(42.4,-71.0)</text>
    <circle class="pt" cx="60"  cy="78"  r="4"/><text class="lbl" x="60"  y="92">(41.2,-73.1)</text>
    <circle class="pt" cx="130" cy="96"  r="4"/><text class="lbl" x="130" y="108">(40.7,-72.6)</text>
    <circle class="pt" cx="208" cy="62"  r="4"/><text class="lbl" x="208" y="54">(41.5,-70.8)</text>
    <circle class="pt" cx="40"  cy="100" r="4"/><text class="lbl" x="40"  y="111">(40.9,-73.4)</text>
  </g>
  <text class="lbl" x="487" y="195">obs[k] = 0.84    at (x[k], y[k]) in some CRS</text>
</svg>
