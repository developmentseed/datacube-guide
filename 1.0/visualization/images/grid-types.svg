<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200"
     font-family="Helvetica,Arial,sans-serif">
  <defs>
    <symbol id="hex" overflow="visible">
      <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
               fill="none" stroke="#455A64" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#455A64"/>
    </symbol>
    <style>
      .stroke { fill:none; stroke:#455A64; stroke-width:2; }
      .dot    { fill:#455A64; }
      .title  { fill:#263238; font-size:56px; text-anchor:middle; font-weight:bold; }
      .label  { fill:#263238; font-size:32px; text-anchor:middle; }
    </style>
  </defs>

  <text class="title" x="600" y="90">Grid Types</text>

  <!-- ============ Panel 1: rectilinear ============ -->
  <g transform="translate(120,180)">
    <path class="stroke" d="M0,0 L360,0 M0,90 L360,90 M0,180 L360,180 M0,270 L360,270 M0,360 L360,360 M0,0 L0,360 M90,0 L90,360 M180,0 L180,360 M270,0 L270,360 M360,0 L360,360"/>
    <circle class="dot" cx="45"  cy="45"  r="6"/>
    <circle class="dot" cx="135" cy="45"  r="6"/>
    <circle class="dot" cx="225" cy="45"  r="6"/>
    <circle class="dot" cx="315" cy="45"  r="6"/>
    <circle class="dot" cx="45"  cy="135" r="6"/>
    <circle class="dot" cx="135" cy="135" r="6"/>
    <circle class="dot" cx="225" cy="135" r="6"/>
    <circle class="dot" cx="315" cy="135" r="6"/>
    <circle class="dot" cx="45"  cy="225" r="6"/>
    <circle class="dot" cx="135" cy="225" r="6"/>
    <circle class="dot" cx="225" cy="225" r="6"/>
    <circle class="dot" cx="315" cy="225" r="6"/>
    <circle class="dot" cx="45"  cy="315" r="6"/>
    <circle class="dot" cx="135" cy="315" r="6"/>
    <circle class="dot" cx="225" cy="315" r="6"/>
    <circle class="dot" cx="315" cy="315" r="6"/>
  </g>
  <text class="label" x="300" y="610">rectilinear</text>

  <!-- ============ Panel 2: curvilinear (warped grid) ============ -->
  <g transform="translate(700,200)">
    <path class="stroke" d="M0,60 Q200,-20 400,60"/>
    <path class="stroke" d="M0,145 Q200,65 400,145"/>
    <path class="stroke" d="M0,230 Q200,150 400,230"/>
    <path class="stroke" d="M0,315 Q200,235 400,315"/>
    <path class="stroke" d="M0,60  C-15,150 -15,225 0,315"/>
    <path class="stroke" d="M100,35 C90,135 95,215 100,290"/>
    <path class="stroke" d="M200,15 C200,115 200,200 200,275"/>
    <path class="stroke" d="M300,35 C310,135 305,215 300,290"/>
    <path class="stroke" d="M400,60 C415,150 415,225 400,315"/>
    <circle class="dot" cx="50"  cy="100" r="6"/>
    <circle class="dot" cx="150" cy="80"  r="6"/>
    <circle class="dot" cx="250" cy="80"  r="6"/>
    <circle class="dot" cx="350" cy="100" r="6"/>
    <circle class="dot" cx="50"  cy="185" r="6"/>
    <circle class="dot" cx="150" cy="165" r="6"/>
    <circle class="dot" cx="250" cy="165" r="6"/>
    <circle class="dot" cx="350" cy="185" r="6"/>
    <circle class="dot" cx="50"  cy="270" r="6"/>
    <circle class="dot" cx="150" cy="250" r="6"/>
    <circle class="dot" cx="250" cy="250" r="6"/>
    <circle class="dot" cx="350" cy="270" r="6"/>
  </g>
  <text class="label" x="900" y="610">curvilinear</text>

  <!-- ============ Panel 3: DGGS (hexagons) ============ -->
  <g transform="translate(140,720)">
    <use href="#hex" x="130" y="70"/>
    <use href="#hex" x="217" y="70"/>
    <use href="#hex" x="304" y="70"/>
    <use href="#hex" x="87"  y="145"/>
    <use href="#hex" x="173" y="145"/>
    <use href="#hex" x="260" y="145"/>
    <use href="#hex" x="347" y="145"/>
    <use href="#hex" x="130" y="220"/>
    <use href="#hex" x="217" y="220"/>
    <use href="#hex" x="304" y="220"/>
    <use href="#hex" x="173" y="295"/>
    <use href="#hex" x="260" y="295"/>
  </g>
  <text class="label" x="300" y="1130">discrete global grid system</text>

  <!-- ============ Panel 4: unstructured (irregular triangles) ============ -->
  <g transform="translate(700,700)">
    <path class="stroke" d="M50,260 L140,140 L250,80 L360,130 L410,230 L360,340 L230,380 L110,330 Z"/>
    <path class="stroke" d="M50,260 L180,200 L140,140"/>
    <path class="stroke" d="M180,200 L250,80"/>
    <path class="stroke" d="M180,200 L290,210"/>
    <path class="stroke" d="M250,80 L290,210"/>
    <path class="stroke" d="M290,210 L360,130"/>
    <path class="stroke" d="M290,210 L410,230"/>
    <path class="stroke" d="M290,210 L360,340"/>
    <path class="stroke" d="M290,210 L220,290"/>
    <path class="stroke" d="M180,200 L220,290"/>
    <path class="stroke" d="M220,290 L230,380"/>
    <path class="stroke" d="M220,290 L110,330"/>
    <path class="stroke" d="M220,290 L360,340"/>
    <path class="stroke" d="M50,260  L110,330"/>
  </g>
  <text class="label" x="900" y="1130">unstructured</text>
</svg>
