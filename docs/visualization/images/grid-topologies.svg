<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="652" height="196" viewBox="0 0 652 196"
     font-family="Helvetica,Arial,sans-serif">
  <style>
    .panel  { fill:#FAFAFA; stroke:#CFD8DC; }
    .grid   { fill:none; stroke:#455A64; stroke-width:1; }
    .face   { stroke:#455A64; stroke-width:1; }
    .title  { fill:#263238; font-size:12.5px; font-weight:bold; text-anchor:middle; }
    .ok     { fill:#2E7D32; font-size:10.5px; text-anchor:middle; }
    .lim    { fill:#EF6C00; font-size:10.5px; text-anchor:middle; }
    .no     { fill:#78909C; font-size:10.5px; text-anchor:middle; }
  </style>

  <!-- ============ Panel 1: Regular ============ -->
  <rect class="panel" x="8"  y="4" width="150" height="184" rx="8"/>
  <text class="title" x="83" y="22">Regular</text>
  <g transform="translate(33,32)">
    <path class="grid" d="M0,0 L0,80 M25,0 L25,80 M50,0 L50,80 M75,0 L75,80 M100,0 L100,80
                          M0,0 L100,0 M0,20 L100,20 M0,40 L100,40 M0,60 L100,60 M0,80 L100,80"/>
  </g>
  <text class="ok" x="83" y="150">TiTiler ✓</text>
  <text class="ok" x="83" y="168">Xpublish ✓</text>

  <!-- ============ Panel 2: Curvilinear ============ -->
  <rect class="panel" x="170" y="4" width="150" height="184" rx="8"/>
  <text class="title" x="245" y="22">Curvilinear</text>
  <g transform="translate(195,32)">
    <path class="grid" d="M0,0 C8,27 -8,53 0,80 M25,0 C33,27 17,53 25,80 M50,0 C58,27 42,53 50,80
                          M75,0 C83,27 67,53 75,80 M100,0 C108,27 92,53 100,80"/>
    <path class="grid" d="M0,4 C27,12 73,-4 100,4 M0,24 C27,32 73,16 100,24 M0,44 C27,52 73,36 100,44
                          M0,64 C27,72 73,56 100,64 M0,80 C27,86 73,72 100,80"/>
  </g>
  <text class="lim" x="245" y="150">TiTiler ✓ limited</text>
  <text class="ok"  x="245" y="168">Xpublish ✓</text>

  <!-- ============ Panel 3: Triangular (FVCOM) ============ -->
  <rect class="panel" x="332" y="4" width="150" height="184" rx="8"/>
  <text class="title" x="407" y="22">Triangular</text>
  <g transform="translate(357,32)">
    <path class="grid" d="M0,0 L100,0 M0,40 L100,40 M0,80 L100,80
                          M0,0 L0,80 M33,0 L33,80 M66,0 L66,80 M100,0 L100,80
                          M0,40 L33,0 M33,40 L66,0 M66,40 L100,0
                          M0,80 L33,40 M33,80 L66,40 M66,80 L100,40"/>
  </g>
  <text class="no" x="407" y="150">TiTiler ✗</text>
  <text class="ok" x="407" y="168">Xpublish ✓</text>

  <!-- ============ Panel 4: HEALPix ============ -->
  <rect class="panel" x="494" y="4" width="150" height="184" rx="8"/>
  <text class="title" x="569" y="22">HEALPix</text>
  <g transform="translate(522,32)">
    <!-- North polar ring (4 diamonds, offset half a pixel) -->
    <polygon class="face" fill="#ECEFF1" points="22,16 32,28 22,40 12,28"/>
    <polygon class="face" fill="#ECEFF1" points="42,16 52,28 42,40 32,28"/>
    <polygon class="face" fill="#ECEFF1" points="62,16 72,28 62,40 52,28"/>
    <polygon class="face" fill="#ECEFF1" points="82,16 92,28 82,40 72,28"/>
    <!-- Equatorial ring (4 diamonds) -->
    <polygon class="face" fill="#CFD8DC" points="12,28 22,40 12,52 2,40"/>
    <polygon class="face" fill="#CFD8DC" points="32,28 42,40 32,52 22,40"/>
    <polygon class="face" fill="#CFD8DC" points="52,28 62,40 52,52 42,40"/>
    <polygon class="face" fill="#CFD8DC" points="72,28 82,40 72,52 62,40"/>
    <!-- South polar ring (4 diamonds, offset half a pixel) -->
    <polygon class="face" fill="#ECEFF1" points="22,40 32,52 22,64 12,52"/>
    <polygon class="face" fill="#ECEFF1" points="42,40 52,52 42,64 32,52"/>
    <polygon class="face" fill="#ECEFF1" points="62,40 72,52 62,64 52,52"/>
    <polygon class="face" fill="#ECEFF1" points="82,40 92,52 82,64 72,52"/>
  </g>
  <text class="no" x="569" y="150">TiTiler ✗</text>
  <text class="ok" x="569" y="168">Xpublish ✓</text>
</svg>
