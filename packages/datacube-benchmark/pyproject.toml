[project]
name = "datacube-benchmark"
dynamic = ["version"]
description = "Utilities to benchmark datacubes with various formats, compressions, and chunking schemes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Max Jones", email = "14077947+maxrjones@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["zarr", "datacube", "benchmark", "xarray", "obstore", "geospatial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "dask>=2025.5.1",
    "numcodecs>=0.16.1",
    "numpy>=2.0",
    "obstore>=0.6.0",
    "pandas>=2.0",
    "pint>=0.24.4",
    "pyarrow>=20.0.0",
    "xarray>=2025.6.1",
    "zarr>=3.0.8",
]

[project.urls]
Homepage = "https://developmentseed.org/datacube-guide/"
Repository = "https://github.com/developmentseed/datacube-guide"
Issues = "https://github.com/developmentseed/datacube-guide/issues"

[project.scripts]
datacube-benchmark = "datacube_benchmark:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# The package lives in a workspace subdirectory; point setuptools-scm at the repo root.
raw-options = { root = "../.." }

[tool.hatch.build.hooks.vcs]
version-file = "src/datacube_benchmark/_version.py"

[tool.numpydoc_validation]
# See https://numpydoc.readthedocs.io/en/latest/validation.html#built-in-validation-checks for list of checks
checks = [
    "GL06",
    "GL07",
    # Currently broken; see https://github.com/numpy/numpydoc/issues/573
    # "GL09",
    "GL10",
    "SS02",
    "SS04",
    "PR02",
    "PR03",
    "PR05",
    "PR06",
]
