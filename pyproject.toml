[project]
name = "datacube-guide"
version = "0.1.0"
description = "Helping people avoid mistakes when producing and using datacubes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datacube-benchmark",
    "hvplot>=0.11.3",
    "matplotlib>=3.10.3",
]

[dependency-groups]
dev = [
    "aiohttp-retry>=2.9.1",
    "aiohttp>=3.11.13",
    "azure-identity>=1.21.0",
    "boto3>=1.38.21",
    "fsspec>=2024.10.0",
    "hypothesis>=6.100.0",
    "ipykernel>=6.29.5",
    "mike>=2.1.3",
    "mkdocs-material[imaging]>=9.6.3",
    "mkdocs-jupyter>=0.25.0",
    "mkdocs-redirects>=1.2.2",
    "mkdocs>=1.6.1",
    "mkdocstrings-python>=1.13.0",
    "mkdocstrings>=0.27.0",
    "markdown-exec[ansi]",
    "moto[s3,server]>=5.1.1",
    "mypy>=1.15.0",
    "pip>=24.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mypy-plugins>=3.2.0",
    "pytest>=8.3.3",
    "ruff>=0.12.0",
    "ipywidgets>=8.1.7",
]

[tool.uv.sources]
datacube_benchmark = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.numpydoc_validation]
# See https://numpydoc.readthedocs.io/en/latest/validation.html#built-in-validation-checks for list of checks
checks = [
    "GL06",
    "GL07",
    # Currently broken; see https://github.com/numpy/numpydoc/issues/573
    # "GL09",
    "GL10",
    "SS02",
    "SS04",
    "PR02",
    "PR03",
    "PR05",
    "PR06",
]


[tool.mypy]
files = ["packages/datacube-benchmark/src/datacube_benchmark"]

[[tool.mypy.overrides]]
# Neither distributes type stubs / a py.typed marker.
module = ["pandas.*", "numcodecs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/datacube-benchmark/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["datacube_benchmark"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
