[project]
name = "datacube-guide"
version = "0.1.0"
description = "Helping people avoid mistakes when producing and using datacubes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datacube-benchmark>=0.1.0",
    "hvplot>=0.11.3",
    "matplotlib>=3.10.3",
    "pandas>=2.3.3",
    "pint>=0.25.2",
    "xarray>=2025.12.0",
    "zarr>=3.2.1",
]

[dependency-groups]
dev = [
    "aiohttp-retry>=2.9.1",
    "aiohttp>=3.11.13",
    "azure-identity>=1.21.0",
    "boto3>=1.38.21",
    "fsspec>=2024.10.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "markdown-exec[ansi]",
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.25.0",
    "mkdocs-material[imaging]>=9.6.3",
    "mkdocs-redirects>=1.2.2",
    "pip>=24.2",
    "ruff>=0.12.0",
]

[tool.uv]
# `datacube-benchmark` is published to PyPI shortly before this guide's releases,
# so its newest upload falls past the rolling `exclude-newer` window. Override the
# cutoff for just this package so resolution can pick it up.
exclude-newer-package = { datacube-benchmark = "2026-06-02T00:00:00Z" }
