name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deny by default; each job grants only what it needs.
permissions: {}

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repo
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Caching is disabled: this workflow can publish (tag trigger), and a
          # cache poisoned by a lower-privilege run could taint the built docs.
          enable-cache: false
          version: "0.5.x"

      - name: Install dependencies
        run: uv sync

      - name: Build docs
        run: uv run -- mkdocs build --strict

  deploy:
    name: Deploy versioned docs (mike)
    needs: build
    # Publish for branch/tag pushes and manual runs, never for pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike commits the built site to the gh-pages branch
    # Never cancel an in-flight deploy: mike pushes to gh-pages, and a
    # half-finished push would leave the branch inconsistent.
    concurrency:
      group: mike-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history is needed so mike can fetch and update gh-pages.
          fetch-depth: 0
          # Don't persist the token to .git/config. The repo is public, so mike
          # fetches gh-pages anonymously; only the push needs auth, supplied
          # transiently via gh below — so the token never touches disk.
          persist-credentials: false

      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Caching is disabled: this workflow can publish (tag trigger), and a
          # cache poisoned by a lower-privilege run could taint the built docs.
          enable-cache: false
          version: "0.5.x"

      - name: Install dependencies
        run: uv sync

      - name: Configure git for mike
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Use gh as git's credential helper: it reads the token from GH_TOKEN
          # at push time, so only the helper command (no token) is written to
          # git config and nothing sensitive appears in the logs.
          gh auth setup-git

      # Push to main rolls the `latest` version — the default readers land on.
      - name: Deploy latest (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run -- mike deploy --push latest

      # A vX.Y.Z tag publishes an immutable major.minor snapshot. `latest` is
      # left untouched, so released versions stay browsable alongside it.
      - name: Deploy release snapshot (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # v1.0.0 -> 1.0.0
          VERSION="${VERSION%.*}"          # 1.0.0  -> 1.0
          uv run -- mike deploy --push "$VERSION"
